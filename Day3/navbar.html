<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Navbar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">

        <h2>Flipkart</h2>

    <ul class="menu">
        <li><a href="#">Login</a></li>
        <li><a href="#">Cart</a></li>
        <li><a href="#">Become a Seller</a></li>

</nav>

</body>
</html>
